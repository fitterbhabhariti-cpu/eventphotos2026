<!DOCTYPE html>
<html lang="gu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find my photos</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14313b;--paper:#f6f7f4;--teal:#0f6b73;--gold:#e8a317;--line:#d5dbd8}
@media(prefers-color-scheme:dark){:root{--ink:#eef2f0;--paper:#10202a;--teal:#4fc1c9;--gold:#f2b83a;--line:#2b414d}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Hind Vadodara",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px}p{margin:.3em 0}.sub{opacity:.8}
.btn{display:block;width:100%;margin:18px 0 8px;padding:16px;border:0;border-radius:12px;background:var(--gold);color:#14313b;font:700 1.1rem inherit;font-family:inherit;text-align:center;cursor:pointer}
.btn.alt{background:none;border:2px solid var(--teal);color:var(--teal);margin:8px 0;padding:12px;font-size:1rem}
.btn:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
#status{min-height:1.6em;font-weight:600;color:var(--teal)}
#sf{width:72px;height:72px;border-radius:50%;object-fit:cover;display:none;border:3px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.card{background:var(--line);border-radius:8px;overflow:hidden;position:relative;aspect-ratio:1}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card a.dl{position:absolute;right:6px;bottom:6px;background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:14px;font-size:.8rem;text-decoration:none}
small{opacity:.7}
</style></head><body><main>
<h1 id="title">તમારા ફોટા શોધો<br><span style="font-weight:400">Find your photos</span></h1>
<p class="sub">સેલ્ફી લો, તમારા ફોટા તરત મળશે. · Take a selfie and we'll find the photos you're in.</p>
<input type="file" id="file" accept="image/*" capture="user" hidden>
<button class="btn" id="take">📷 સેલ્ફી લો · Take selfie</button>
<button class="btn alt" id="pick">ગેલેરીમાંથી ફોટો · Choose from gallery</button>
<p><small>સેલ્ફી તમારા ફોનમાં જ ચકાસાય છે, ક્યાંય સેવ થતી નથી. · Your selfie is matched on your phone and never uploaded or saved.</small></p>
<div class="row"><img id="sf" alt="Your selfie"><span id="status" role="status"></span></div>
<div class="row"><label for="tol">Match · મેળ:</label>
<select id="tol"><option value=".42">Strict · કડક</option><option value=".5" selected>Normal · સામાન્ય</option><option value=".58">Loose · છૂટ</option></select></div>
<div id="out" class="grid"></div>
<button class="btn alt" id="more" hidden>વધુ બતાવો · Show more</button>
<button class="btn alt" id="all">બધા ફોટા જુઓ · Browse all photos</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const MODELS="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";
const $=id=>document.getElementById(id);let DB,modelsReady,list=[],shown=0,desc=null;
const st=t=>$("status").textContent=t;
const thumb=id=>`https://lh3.googleusercontent.com/d/${id}=w500`;
fetch("index.json").then(r=>r.json()).then(d=>{DB=d;if(d.title)$("title").innerHTML=d.title+'<br><span style="font-weight:400">Find your photos</span>';}).catch(()=>st("index.json મળ્યું નથી · index.json not found"));
async function loadModels(){if(modelsReady)return;st("તૈયારી… · Getting ready…");
await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)]);modelsReady=true}
function toCanvas(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);$("sf").src=u;$("sf").style.display="block";ok(c)};i.onerror=no;i.src=u})}
const dist=(a,b)=>{let s=0;for(let i=0;i<128;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};
async function run(file){if(!DB)return st("થોડી રાહ જુઓ · Please wait…");
try{await loadModels();const c=await toCanvas(file);st("ચહેરો શોધી રહ્યા છીએ… · Looking for your face…");
const f=await faceapi.detectAllFaces(c,new faceapi.SsdMobilenetv1Options({minConfidence:.5})).withFaceLandmarks().withFaceDescriptors();
if(!f.length)return st("ચહેરો દેખાયો નથી. સામે જોઈને ફરી પ્રયાસ કરો. · No face found. Face the camera and try again.");
f.sort((a,b)=>b.detection.box.area-a.detection.box.area);desc=f[0].descriptor;match()}
catch(e){console.error(e);st("કંઈક ખોટું થયું. ફરી પ્રયાસ કરો. · Something went wrong. Try again.")}}
function match(){if(!desc)return;const t=+$("tol").value,best={};
for(const f of DB.faces){const d=dist(desc,f.d);if(d<t&&(best[f.p]===undefined||d<best[f.p]))best[f.p]=d}
list=Object.keys(best).sort((a,b)=>best[a]-best[b]).map(i=>DB.photos[i]);
$("out").innerHTML="";shown=0;
st(list.length?`${list.length} ફોટા મળ્યા · ${list.length} photos found`:"કોઈ ફોટા મળ્યા નથી. 'છૂટ' પસંદ કરો અથવા બધા ફોટા જુઓ. · No match. Try 'Loose' or browse all.");more()}
function more(){const n=list.slice(shown,shown+30);shown+=n.length;
for(const id of n){const d=document.createElement("div");d.className="card";
d.innerHTML=`<a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener"><img loading="lazy" src="${thumb(id)}" alt="Event photo"></a><a class="dl" href="https://drive.google.com/uc?export=download&id=${id}">⬇</a>`;$("out").appendChild(d)}
$("more").hidden=shown>=list.length}
$("take").onclick=()=>{$("file").setAttribute("capture","user");$("file").click()};
$("pick").onclick=()=>{$("file").removeAttribute("capture");$("file").click()};
$("file").onchange=e=>e.target.files[0]&&run(e.target.files[0]);
$("tol").onchange=match;$("more").onclick=more;
$("all").onclick=()=>{if(!DB)return;list=DB.photos;$("out").innerHTML="";shown=0;st(`કુલ ${list.length} ફોટા · ${list.length} photos`);more()};
</script></body></html>
